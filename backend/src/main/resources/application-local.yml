server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:seckill;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql
      data-locations: classpath:data-local.sql

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

rocketmq:
  name-server:

jwt:
  secret: MzI4MjdhZjM2NTg5MGFmYjM2NTg5MGFmYjM2NTg5MGFmYjM2NTg5MA
  dev-auth-fallback: true

cors:
  allowed-origins: "*"

logging:
  level:
    com.seckill: debug
    com.baomidou.mybatisplus: debug
